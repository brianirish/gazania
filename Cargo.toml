[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/brianirish/zinnia"
description = "Disk hub for Arch Linux: drives, volumes and usage in a GTK4 app with a CLI twin"
readme = "README.md"
keywords = ["disk", "storage", "gtk4", "libadwaita", "udisks2"]
categories = ["filesystem", "gui", "command-line-utilities"]

[workspace.dependencies]
zinnia-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = "5"
zvariant = "5"
rustix = { version = "1", features = ["fs"] }
futures-lite = "2"
clap = { version = "4", features = ["derive"] }
toml = "1"
tempfile = "3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
